name: SK Finance Ltd
description: 'SK Finance Ltd (skfin.in) is a Jaipur, India-based non-banking financial
  company (NBFC) providing asset-backed retail lending. Its products span commercial
  vehicle, car, tractor, construction-equipment and two-wheeler loans alongside secured
  business loans and home-renovation / mortgage finance, delivered through a physical
  branch network with EMI calculators, online EMI payment, a branch locator, a loan-application
  portal and a customer "Refer and Earn" referral program. Backed by Norwest Venture
  Partners. As of this enrichment pass the company publishes a corporate/marketing
  website (Next.js) with no public developer portal, API documentation, SDKs or other
  machine-readable API surface.'
